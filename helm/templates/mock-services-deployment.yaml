{{- if .Values.externalServices.mockServices.enabled }}
---
# OptiCore Mock Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-opticore
  namespace: {{ .Release.Namespace }}
  labels:
    app: mock-opticore
    app.kubernetes.io/name: mock-opticore
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.externalServices.mockServices.opticore.replicas }}
  selector:
    matchLabels:
      app: mock-opticore
  template:
    metadata:
      labels:
        app: mock-opticore
    spec:
      containers:
      - name: opticore
        image: "{{ .Values.externalServices.mockServices.opticore.image }}:{{ .Values.externalServices.mockServices.opticore.tag }}"
        ports:
        - containerPort: {{ .Values.externalServices.mockServices.opticore.port }}
          name: http
          protocol: TCP
        resources:
          {{- toYaml .Values.externalServices.mockServices.opticore.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
# OptiCore Mock Service
apiVersion: v1
kind: Service
metadata:
  name: mock-opticore
  namespace: {{ .Release.Namespace }}
  labels:
    app: mock-opticore
    app.kubernetes.io/name: mock-opticore
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: mock-opticore
  ports:
  - port: {{ .Values.externalServices.mockServices.opticore.port }}
    targetPort: {{ .Values.externalServices.mockServices.opticore.port }}
    protocol: TCP
    name: http
