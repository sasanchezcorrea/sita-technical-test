{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optiflight-coordinator.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiflight-coordinator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  database-url: {{ include "optiflight-coordinator.databaseUrl" . | b64enc }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-url: {{ include "optiflight-coordinator.redisUrl" . | b64enc }}
  {{- end }}
  {{- if .Values.kafka.enabled }}
  kafka-brokers: {{ include "optiflight-coordinator.kafkaBrokers" . | b64enc }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
