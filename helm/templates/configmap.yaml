{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "optiflight-coordinator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiflight-coordinator.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.configMap.data | nindent 2 }}
{{- end }}
