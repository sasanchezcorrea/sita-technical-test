apiVersion: v1
kind: Service
metadata:
  name: {{ include "optiflight-coordinator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiflight-coordinator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "optiflight-coordinator.selectorLabels" . | nindent 4 }}
---
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "optiflight-coordinator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiflight-coordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: metrics
  selector:
    {{- include "optiflight-coordinator.selectorLabels" . | nindent 4 }}
{{- end }}
