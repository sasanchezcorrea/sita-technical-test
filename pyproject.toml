[project]
name = "optiflight-coordinator-infrastructure"
version = "1.0.0"
description = "OptiFlight Coordinator CDKTF Infrastructure as Code"
authors = [
    {name = "SITA Technical Team", email = "tech@sita.aero"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    # CDKTF Core
    "cdktf>=0.20.0",
    "constructs>=10.0.0",
    # CDKTF Providers
    "cdktf-cdktf-provider-helm>=10.0.0",
    "cdktf-cdktf-provider-kubernetes>=10.0.0",
    "cdktf-cdktf-provider-random>=11.0.0",
    # Utility libraries
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "fastapi>=0.116.1",
    "logging>=0.4.9.6",
    "pytest-cov>=6.2.1",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    
    # Testing
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "respx>=0.20.0",
]

testing = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "kubernetes>=27.0.0",
    "docker>=6.0.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
]

[project.scripts]
optiflight-deploy = "infrastructure.cli:main"
optiflight-test = "infrastructure.test_runner:main"

[project.urls]
Homepage = "https://github.com/sita/optiflight-coordinator"
Documentation = "https://optiflight-coordinator.readthedocs.io"
Repository = "https://github.com/sita/optiflight-coordinator.git"
Issues = "https://github.com/sita/optiflight-coordinator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infrastructure"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | \.gen
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "cdktf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "constructs.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["infrastructure"]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
    "*/.gen/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
